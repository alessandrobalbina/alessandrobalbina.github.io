name: Update Repo Visualizer

on:
  push:
    branches:
      - main # Sostituisci con 'master' se il tuo branch principale si chiama così

permissions:
  contents: write

jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate repo diagram
        uses: githubocto/repo-visualizer@0.6.1
        with:
          output_file: images/diagram.svg
          excluded_paths: "node_modules,dist,.git,.github,assets/fonts,images,docs"
          max_depth: 4
          color_encoding: "type"
          commit_message: "chore(ci): update repository visualization diagram [skip ci]"
          file_colors: '{"html":"#1b4b82","css":"#0284c7","js":"#f59e0b","svg":"#16a34a","png":"#7c3aed","webp":"#7c3aed","pdf":"#dc2626","xml":"#64748b","txt":"#64748b","md":"#475569"}'
